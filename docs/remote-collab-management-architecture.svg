<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">plant-collab-monitor remote collaboration architecture</title>
  <desc id="desc">Vue monitor console connects to plant-model-gen web_server through API and SSE, and observes remote sites, MQTT nodes, sync jobs, and site configuration.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #111827; }
    .title { font-size: 24px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #6b7280; }
    .layer-title { font-size: 15px; font-weight: 700; fill: #374151; }
    .node-title { font-size: 15px; font-weight: 700; }
    .node-sub { font-size: 12px; fill: #6b7280; }
    .label { font-size: 12px; fill: #4b5563; }
    .container { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; stroke-dasharray: 8 5; rx: 18; }
    .client { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; rx: 12; }
    .adapter { fill: #f0fdfa; stroke: #99f6e4; stroke-width: 1.5; rx: 12; }
    .backend { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; rx: 12; }
    .data { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; rx: 12; }
    .external { fill: #faf5ff; stroke: #ddd6fe; stroke-width: 1.5; rx: 12; }
    .arrow-api { stroke: #2563eb; stroke-width: 2.2; fill: none; marker-end: url(#arrow-api); }
    .arrow-sse { stroke: #9333ea; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow-sse); }
    .arrow-data { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#arrow-data); }
    .arrow-cross { stroke: #ea580c; stroke-width: 2; fill: none; marker-end: url(#arrow-cross); }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-api" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-sse" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-data" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-cross" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="54" class="title">plant-collab-monitor Remote Collaboration Architecture</text>
  <text x="60" y="78" class="subtitle">Independent Vue 3 SPA. The only business backend is plant-model-gen web_server. UI combines API, SSE, MQTT, and cross-site probes.</text>

  <rect x="50" y="115" width="1100" height="120" class="container"/>
  <text x="74" y="145" class="layer-title">Frontend Monitor Console</text>
  <rect x="95" y="165" width="210" height="48" class="client" filter="url(#shadow)"/>
  <text x="118" y="187" class="node-title">Vue 3 SPA</text>
  <text x="118" y="205" class="node-sub">Routes / Pinia / Naive UI</text>
  <rect x="375" y="165" width="230" height="48" class="client" filter="url(#shadow)"/>
  <text x="398" y="187" class="node-title">Admin Login Flow</text>
  <text x="398" y="205" class="node-sub">router guard + session token</text>
  <rect x="675" y="165" width="220" height="48" class="client" filter="url(#shadow)"/>
  <text x="698" y="187" class="node-title">StatusBar &amp; Views</text>
  <text x="698" y="205" class="node-sub">dashboard / topology / mqtt</text>

  <rect x="50" y="275" width="1100" height="132" class="container"/>
  <text x="74" y="305" class="layer-title">Frontend Communication Layer</text>
  <rect x="95" y="332" width="240" height="52" class="adapter" filter="url(#shadow)"/>
  <text x="118" y="354" class="node-title">src/api/*.ts</text>
  <text x="118" y="372" class="node-sub">axios baseURL + Bearer interceptor</text>
  <rect x="420" y="332" width="250" height="52" class="adapter" filter="url(#shadow)"/>
  <text x="443" y="354" class="node-title">useSse()</text>
  <text x="443" y="372" class="node-sub">EventSource or fetch stream</text>
  <rect x="755" y="332" width="245" height="52" class="adapter" filter="url(#shadow)"/>
  <text x="778" y="354" class="node-title">Direct Cross-site Fetch</text>
  <text x="778" y="372" class="node-sub">health / site-info / config import</text>

  <rect x="50" y="447" width="1100" height="142" class="container"/>
  <text x="74" y="477" class="layer-title">Only Backend: plant-model-gen web_server</text>
  <rect x="95" y="505" width="220" height="54" class="backend" filter="url(#shadow)"/>
  <text x="118" y="528" class="node-title">Admin Auth</text>
  <text x="118" y="546" class="node-sub">/api/admin/auth/*</text>
  <rect x="365" y="505" width="250" height="54" class="backend" filter="url(#shadow)"/>
  <text x="388" y="528" class="node-title">Remote Sync APIs</text>
  <text x="388" y="546" class="node-sub">env / site / topology / logs</text>
  <rect x="665" y="505" width="220" height="54" class="backend" filter="url(#shadow)"/>
  <text x="688" y="528" class="node-title">MQTT &amp; Sync APIs</text>
  <text x="688" y="546" class="node-sub">nodes / messages / queue</text>
  <rect x="935" y="505" width="170" height="54" class="backend" filter="url(#shadow)"/>
  <text x="958" y="528" class="node-title">Site Config</text>
  <text x="958" y="546" class="node-sub">validate / save / reload</text>

  <rect x="50" y="630" width="1100" height="80" class="container"/>
  <text x="74" y="660" class="layer-title">Runtime Resources and Remote Sites</text>
  <rect x="245" y="675" width="175" height="36" class="data"/>
  <text x="268" y="698" class="node-title">DbOption.toml</text>
  <rect x="505" y="675" width="185" height="36" class="data"/>
  <text x="528" y="698" class="node-title">Queue / Archives</text>
  <rect x="775" y="675" width="190" height="36" class="external"/>
  <text x="798" y="698" class="node-title">Remote Site APIs</text>

  <path d="M305 189 H375" class="arrow-api"/>
  <path d="M605 189 H675" class="arrow-api"/>
  <path d="M215 213 V332" class="arrow-api"/>
  <path d="M785 213 V332" class="arrow-sse"/>
  <path d="M490 213 V332" class="arrow-api"/>
  <path d="M215 384 V505" class="arrow-api"/>
  <path d="M545 384 V505" class="arrow-sse"/>
  <path d="M878 384 C878 432 1020 430 1020 505" class="arrow-cross"/>
  <path d="M205 559 C205 615 332 615 332 675" class="arrow-data"/>
  <path d="M490 559 C490 615 598 615 598 675" class="arrow-data"/>
  <path d="M775 559 C775 615 870 615 870 675" class="arrow-data"/>
  <path d="M1020 559 V675" class="arrow-data"/>

  <rect x="191" y="252" width="88" height="22" fill="#ffffff" opacity="0.96" rx="5"/>
  <text x="203" y="268" class="label">same-origin API</text>
  <rect x="514" y="429" width="78" height="22" fill="#ffffff" opacity="0.96" rx="5"/>
  <text x="526" y="445" class="label">SSE events</text>
  <rect x="888" y="430" width="104" height="22" fill="#ffffff" opacity="0.96" rx="5"/>
  <text x="900" y="446" class="label">site probes</text>

  <g transform="translate(68, 720)">
    <line x1="0" y1="8" x2="34" y2="8" class="arrow-api"/>
    <text x="44" y="12" class="label">API request</text>
    <line x1="140" y1="8" x2="174" y2="8" class="arrow-sse"/>
    <text x="184" y="12" class="label">realtime event</text>
    <line x1="310" y1="8" x2="344" y2="8" class="arrow-data"/>
    <text x="354" y="12" class="label">config and job data</text>
    <line x1="520" y1="8" x2="554" y2="8" class="arrow-cross"/>
    <text x="564" y="12" class="label">direct remote call</text>
  </g>
</svg>
